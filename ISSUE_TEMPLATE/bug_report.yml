name: "🐞 Reporte de Error (Bug)"
description: "Para informar algo que no funciona como debería."
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🚨 Gracias por reportar este error
        Por favor, completa la siguiente información para ayudarnos a resolverlo lo antes posible.

  - type: textarea
    id: descripcion
    attributes:
      label: "❌ Descripción del Problema"
      description: "¿Qué está pasando? Describe el comportamiento erróneo de forma clara."
      placeholder: "Ej: El botón de envío no reacciona al hacer clic..."
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: "👣 Pasos para Reproducir"
      description: "Indica la secuencia exacta para ver el error."
      value: |
        1. Ir a '...'
        2. Dar clic en '...'
        3. Ver el error '...'
    validations:
      required: true

  - type: textarea
    id: comportamiento
    attributes:
      label: "📉 Comportamiento Esperado vs. Actual"
      description: "Compara lo que debería pasar con lo que realmente sucede."
      placeholder: "- Esperado: ... \n- Actual: ..."
    validations:
      required: true

  - type: input
    id: guia_tecnica
    attributes:
      label: "📂 Guía Técnica (Dónde investigar)"
      description: "Menciona archivos, funciones o contexto técnico sospechoso."
      placeholder: "Ej: src/path/archivo.ext | nombreDeLaFuncion()"

  - type: checkboxes
    id: criterios
    attributes:
      label: "📋 Criterios de Corrección"
      options:
        - label: "El error ya no ocurre bajo los pasos de reproducción."
        - label: "Se han validado casos borde (ej. datos nulos, strings vacíos)."
        - label: "No afecta funcionalidades relacionadas."

  - type: input
    id: reporte_info
    attributes:
      label: "📝 Información de Control"
      description: "¿Quién reporta este error?"
      placeholder: "Tu nombre completo"
    validations:
      required: true
